<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Amoriva – Members</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="app has-nav">
  <div class="topbar">
    <div class="brand"><div class="logo">💬</div>Amoriva</div>
    <span class="icon-btn" id="onlineCount">● 0 online</span>
  </div>

  <div class="card">
    <h1>Find a language partner</h1>
    <p class="muted small" style="margin-bottom:14px">Real members, real-time status. Tap <b>Message</b> to start a conversation.</p>
    <input class="input" id="search" placeholder="Search by name, country, language or interest">
    <div class="scroll-x" id="filters" style="margin-top:12px">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="online">🟢 Online now</button>
      <button class="chip" data-f="teach">Can help me learn</button>
      <button class="chip" data-f="help">Learning my language</button>
    </div>
  </div>

  <div id="ad1"></div>
  <div id="list"><div class="card"><div class="loader"></div></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="common.js"></script>
<script>
  let me, myUid, users = {}, statuses = {}, blocked = {}, filter = "all";

  requireAuth().then(({ user, profile }) => {
    me = profile; myUid = user.uid;
    renderNav("members");
    renderAd($("#ad1"));

    ref("blocks/" + myUid).on("value", (s) => { blocked = s.val() || {}; render(); });
    ref("users").orderByChild("lastSeen").limitToLast(300).on("value", (s) => { users = s.val() || {}; render(); });
    ref("status").on("value", (s) => { statuses = s.val() || {}; render(); });
  });

  $("#filters").onclick = (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    $$("#filters .chip").forEach((c) => c.classList.toggle("on", c === b));
    filter = b.dataset.f; render();
  };
  $("#search").oninput = () => render();

  const isOnline = (uid) => statuses[uid] && statuses[uid].state === "online";
  const overlap = (a = [], b = []) => a.filter((x) => b.includes(x));

  // Clearly-labelled example members, shown only when there are no real members to list yet,
  // so a new user sees exactly how a real card will look. Some are "Online", some "typing".
  const PSEUDO_MEMBERS = [
    { name: "Amara", country: "NG", speaks: ["English"], learning: ["Swahili"], interests: ["Music", "Cooking"], bio: "Happy to help with English — teach me some Swahili!", mode: "online" },
    { name: "Lukas", country: "DE", speaks: ["German"], learning: ["English"], interests: ["Travel", "Football"], bio: "Learning English, love talking about football and travel.", mode: "typing" },
    { name: "Mei", country: "CN", speaks: ["Chinese"], learning: ["English"], interests: ["Movies", "Art"], bio: "Let's practise together and swap stories about our cultures.", mode: "online" },
    { name: "Sofia", country: "BR", speaks: ["Portuguese"], learning: ["Spanish"], interests: ["Dance", "Food"], bio: "Brazilian, learning Spanish. Tell me about your country's food!", mode: "typing" }
  ];
  function pseudoMemberCard(u) {
    const statusHTML = u.mode === "typing"
      ? `<span class="status-text typing">${esc(countryName(u.country))} · typing <span class="typing-dots"><span></span><span></span><span></span></span></span>`
      : `<span class="status-text online">${esc(countryName(u.country))} · Online now</span>`;
    return `<div class="card member">
      ${avatarHTML(u, u.name, true)}
      <div class="info">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div class="name">${esc(u.name)} ${flag(u.country)}</div>
          <span class="tag" style="background:#fde68a;color:#92400e;font-weight:800">PSEUDO</span>
        </div>
        ${statusHTML}
        <p class="bio">${esc(u.bio)}</p>
        <div class="lang-row"><b>Speaks:</b> ${esc(u.speaks.join(", "))}</div>
        <div class="lang-row"><b>Learning:</b> ${esc(u.learning.join(", "))}</div>
        <div class="chips" style="margin-top:8px">${u.interests.map((i) => `<span class="tag">${esc(i)}</span>`).join("")}</div>
        <div class="tag" style="margin-top:8px;background:var(--surface-2);color:var(--muted)">Example profile · not a real member</div>
        <div class="actions"><button class="btn btn-primary btn-sm pseudo-msg" style="display:block;width:100%;text-align:center">💬 Message</button></div>
      </div>
    </div>`;
  }

  function render() {
    if (!me) return;
    const q = $("#search").value.trim().toLowerCase();
    const myLearning = me.learning || [], mySpeaks = me.speaks || [];

    let rows = Object.entries(users)
      .filter(([uid, u]) => uid !== myUid && u.profileComplete && !blocked[uid])
      .map(([uid, u]) => {
        const canTeach = overlap(u.speaks, myLearning);
        const canHelp = overlap(u.learning, mySpeaks);
        return { uid, u, online: isOnline(uid), canTeach, canHelp, score: canTeach.length * 2 + canHelp.length };
      });

    const onlineTotal = rows.filter((r) => r.online).length;
    $("#onlineCount").textContent = `● ${onlineTotal} online`;

    if (filter === "online") rows = rows.filter((r) => r.online);
    if (filter === "teach") rows = rows.filter((r) => r.canTeach.length);
    if (filter === "help") rows = rows.filter((r) => r.canHelp.length);
    if (q) rows = rows.filter(({ u }) => [u.name, countryName(u.country), ...(u.speaks || []),
      ...(u.learning || []), ...(u.interests || [])].join(" ").toLowerCase().includes(q));

    rows.sort((a, b) => (b.online - a.online) || (b.score - a.score) || ((b.u.lastSeen || 0) - (a.u.lastSeen || 0)));

    const list = $("#list");
    if (!rows.length) {
      list.innerHTML = `<div class="card empty" style="padding:20px 18px">
          <div class="big">🌱</div>
          <h2>${filter === "online" ? "Nobody else is online right now" : "No members yet"}</h2>
          <p class="muted small" style="margin:8px 0 16px">Amoriva grows as people join. The cards below are <b>examples</b> that show how real members will appear here. Invite a friend to get the community started.</p>
          <button class="btn btn-primary btn-sm" id="inviteBtn">📤 Invite friends</button>
        </div>`
        + PSEUDO_MEMBERS.map(pseudoMemberCard).join("");
      $("#inviteBtn").onclick = invite;
      $$("#list .pseudo-msg").forEach((b) => b.onclick = () =>
        toast("Example profile — real members appear here as people join. Invite a friend to grow Amoriva."));
      return;
    }

    list.innerHTML = rows.map((r, idx) => {
      const { uid, u, online } = r;
      const st = statusLabel(statuses[uid]);
      const typing = statuses[uid] && statuses[uid].typing === true;
      const statusHTML = typing
        ? `<span class="status-text typing">${esc(countryName(u.country))}${countryName(u.country) ? " · " : ""}typing <span class="typing-dots"><span></span><span></span><span></span></span></span>`
        : `<span class="status-text ${st.online ? "online" : ""}">${countryName(u.country) ? esc(countryName(u.country)) + " · " : ""}${st.text}</span>`;
      const matchLine = r.canTeach.length
        ? `<span class="pill" style="margin-top:6px">✨ Speaks ${esc(r.canTeach.join(", "))}</span>`
        : r.canHelp.length ? `<span class="pill" style="margin-top:6px">🤝 Learning ${esc(r.canHelp.join(", "))}</span>` : "";
      return `<div class="card member">
        ${avatarHTML(u, uid, online)}
        <div class="info">
          <div class="name"><a href="profile.html?u=${encodeURIComponent(uid)}" style="color:inherit">${esc(u.name)}</a> ${flag(u.country)}</div>
          ${statusHTML}
          ${matchLine}
          ${u.bio ? `<p class="bio">${esc(u.bio)}</p>` : ""}
          <div class="lang-row"><b>Speaks:</b> ${esc((u.speaks || []).join(", "))}</div>
          <div class="lang-row"><b>Learning:</b> ${esc((u.learning || []).join(", "))}</div>
          ${(u.interests || []).length ? `<div class="chips" style="margin-top:8px">${u.interests.map((i) => `<span class="tag">${esc(i)}</span>`).join("")}</div>` : ""}
          <div class="actions"><a class="btn btn-primary btn-sm" style="display:block;width:100%;text-align:center" href="chat.html?u=${encodeURIComponent(uid)}">💬 Message</a></div>
        </div>
      </div>`;
    }).join("");
  }

  function invite() {
    const data = { title: "Amoriva", text: "Join me on Amoriva — a free language & culture exchange.", url: location.origin + "/index.html" };
    if (navigator.share) navigator.share(data).catch(() => {});
    else { navigator.clipboard?.writeText(data.url); toast("Link copied"); }
  }
</script>
</body>
</html>
